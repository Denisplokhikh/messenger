# Продакшн-конфигурация (Coolify или любой сервер за reverse proxy).
# Отличия от docker-compose.yml (dev):
#   - код запечён в образ: без --reload и без монтирования ./app
#   - наружу не открыт ни один порт: HTTPS и WebSocket проксирует Coolify (Traefik)
#   - нет adminer
#   - секреты только из переменных окружения, без дефолтов: забыл переменную — деплой упадёт сразу.
#     Только ${VAR:?} без текста: ${VAR:?сообщение} Coolify подставляет как значение переменной
#
# В Coolify: Build Pack = Docker Compose, файл /docker-compose.prod.yml,
# домен задаётся у сервиса backend с портом: https://chat.example.com:8000

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Без $${VAR}: Coolify ломает такое экранирование при переписывании compose, и проверка всегда падает.
    # ${VAR} подставляется при разборе compose. Без -U pg_isready ходит под пользователем ОС (root),
    # и Postgres каждые 5 секунд пишет в лог FATAL: role "root" does not exist
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: .
    restart: unless-stopped
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-FastAPI Messenger}
      DEBUG: "false"
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?}
      ALGORITHM: ${ALGORITHM:-HS256}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:?}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    # Порт виден только внутри docker-сети, снаружи запросы приходят через прокси Coolify.
    # Поэтому --forwarded-allow-ips * из Dockerfile здесь безопасен: подделать X-Forwarded-For в обход прокси нельзя
    expose:
      - "8000"
    volumes:
      # Аватарки переживают пересборку и редеплой
      - media_data:/app/media
    # healthcheck задан в Dockerfile (HEALTHCHECK)
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
