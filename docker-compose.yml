services:
  db:
    image: postgres:16-alpine
    container_name: messenger_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messenger_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: .
    container_name: messenger_backend
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
    volumes:
      - ./static:/app/static
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"
    depends_on:
      - db

  adminer:
    image: adminer:latest
    container_name: messenger_adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db


volumes:
  postgres_data:
