# Dev-окружение: docker compose up -d
# Прод (Coolify) — docker-compose.prod.yml.
# Креды берутся из .env (compose читает его сам для подстановки ${...}).
# Порты открыты только на 127.0.0.1, чтобы БД и adminer не торчали в локальную сеть.

services:
  db:
    image: postgres:16-alpine
    container_name: messenger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-messenger_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Без -U pg_isready ходит под пользователем ОС (root), и Postgres пишет в лог FATAL: role "root" does not exist
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-messenger_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: .
    container_name: messenger_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      # На Windows события изменения файлов не доходят в контейнер — следим опросом
      - WATCHFILES_FORCE_POLLING=true
    # Dev-режим: uvicorn перезапускается сам при изменениях в смонтированной ./app
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips *
      --reload --reload-dir /app/app
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      # Аватарки и прочие загрузки переживают пересборку контейнера
      - media_data:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: messenger_adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  postgres_data:
  media_data:
