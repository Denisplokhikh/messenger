map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Главный JS отдаём без кэша для быстрой разработки
    location = /static/app.js {
        alias /app/static/app.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Раздача остальных статических файлов (CSS, SVG, и т.д.)
    location /static/ {
        alias /app/static/;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Все остальные запросы и WebSocket направляем в FastAPI
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Долгие таймауты для постоянного соединения
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
