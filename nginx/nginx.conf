map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ассеты Vite содержат хеш в имени — кешируем надолго
    location /assets/ {
        proxy_pass http://backend:8000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Аватарки: при смене сохраняются под новым случайным именем, старый файл не меняется — тоже кешируем
    location /media/ {
        proxy_pass http://backend:8000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Всё остальное (API, WebSocket, SPA) направляем в FastAPI
    location / {
        proxy_pass http://backend:8000;

        # Поддержка WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Долгие таймауты для постоянного соединения
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
