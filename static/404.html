<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Страница не найдена | FastAPI Messenger</title>

  <!-- Tailwind CSS & Inter Font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="/static/style.css?v=8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen w-screen flex items-center justify-center font-sans p-4 select-none overflow-hidden relative">

  <!-- Фоновые неоновые свечения -->
  <div class="absolute -top-32 -left-32 w-80 h-80 bg-blue-600/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Карточка 404 -->
  <main class="w-full max-w-lg bg-slate-900/90 border border-slate-800 rounded-3xl p-8 sm:p-10 shadow-2xl backdrop-blur-xl relative z-10 text-center">
    
    <!-- Анимированная иконка / Графика -->
    <div class="relative inline-flex items-center justify-center mb-6">
      <div class="w-24 h-24 rounded-2xl bg-gradient-to-tr from-blue-600/20 to-indigo-500/20 border border-blue-500/30 flex items-center justify-center shadow-inner">
        <span class="text-5xl select-none animate-bounce">🔍</span>
      </div>
      <div class="absolute -top-1 -right-1 px-2.5 py-0.5 bg-rose-500/20 border border-rose-500/40 text-rose-400 text-xs font-bold rounded-full tracking-wider">
        404
      </div>
    </div>

    <!-- Заголовки -->
    <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight mb-3">
      Страница не найдена
    </h1>
    <!-- Информационный бейдж с текущим путем -->
    <div class="mb-8 px-4 py-2.5 bg-slate-950/70 border border-slate-800/80 rounded-xl text-xs font-mono text-slate-400 flex items-center justify-center gap-2 max-w-xs mx-auto overflow-hidden text-ellipsis">
      <span class="text-slate-600">Путь:</span>
      <span id="requested-path" class="text-blue-400 font-semibold truncate">...</span>
    </div>

    <!-- Кнопки действий -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="/" class="w-full sm:w-auto px-6 py-3 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-semibold text-sm rounded-xl transition-all shadow-lg shadow-blue-600/25 flex items-center justify-center gap-2">
        <span>💬</span>
        <span>К чатам</span>
      </a>
      <a href="/profile" class="w-full sm:w-auto px-6 py-3 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-semibold text-sm rounded-xl transition-all border border-slate-700 flex items-center justify-center gap-2">
        <span>👤</span>
        <span>Мой профиль</span>
      </a>
    </div>

    <!-- Автоматический возврат -->
    <div class="mt-6 text-xs text-slate-500 flex items-center justify-center gap-1">
      <span>Автоматический возврат через</span>
      <span id="countdown" class="font-bold text-slate-400">10</span>
      <span>сек...</span>
      <button id="cancel-timer" class="text-blue-400 hover:underline ml-1">Отмена</button>
    </div>

  </main>

  <script>
    // Отображаем запрошенный путь
    const pathEl = document.getElementById('requested-path');
    if (pathEl) {
      pathEl.textContent = window.location.pathname || '—';
    }

    // Таймер обратного отсчета
    let timeLeft = 10;
    const countdownEl = document.getElementById('countdown');
    const cancelBtn = document.getElementById('cancel-timer');

    const timer = setInterval(() => {
      timeLeft -= 1;
      if (countdownEl) countdownEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.replace('/');
      }
    }, 1000);

    if (cancelBtn) {
      cancelBtn.addEventListener('click', (e) => {
        e.preventDefault();
        clearInterval(timer);
        cancelBtn.parentElement.innerHTML = '<span class="text-slate-500">Автоматический переход отменен</span>';
      });
    }
  </script>
</body>
</html>
