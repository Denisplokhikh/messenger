<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastAPI Messenger</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Vue Advanced Chat Web Component -->
  <script src="https://cdn.jsdelivr.net/npm/vue-advanced-chat@2.1.2/dist/vue-advanced-chat.umd.js"></script>
</head>
<body>
  <div id="app" class="app-container">

    <!-- Auth Modal (Shown when not logged in) -->
    <div id="auth-modal" class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-header">
          <div class="logo-icon">💬</div>
          <h2>FastAPI Messenger</h2>
          <p class="subtitle">Быстрый мессенджер реального времени</p>
        </div>

        <div class="auth-tabs">
          <button id="tab-login" class="tab-btn active" type="button">Вход</button>
          <button id="tab-register" class="tab-btn" type="button">Регистрация</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label for="login-username">Имя пользователя или Email</label>
            <input type="text" id="login-username" placeholder="alex или alex@mail.com" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="login-password">Пароль</label>
            <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <div id="login-error" class="form-error hidden"></div>
          <button type="submit" class="btn btn-primary w-full">Войти</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form hidden">
          <div class="form-group">
            <label for="reg-username">Имя пользователя</label>
            <input type="text" id="reg-username" placeholder="alex" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="alex@mail.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="reg-password">Пароль</label>
            <input type="password" id="reg-password" placeholder="Минимум 6 символов" required minlength="6" autocomplete="new-password">
          </div>
          <div id="register-error" class="form-error hidden"></div>
          <button type="submit" class="btn btn-primary w-full">Зарегистрироваться</button>
        </form>
      </div>
    </div>

    <!-- Main Messenger View -->
    <div id="messenger-view" class="messenger-main-view hidden">
      <!-- Top Navigation Bar -->
      <header class="top-navbar">
        <div class="nav-brand">
          <span class="brand-icon">💬</span>
          <span class="brand-title">FastAPI Messenger</span>
          <span id="ws-status" class="status-badge status-offline">● Офлайн</span>
        </div>

        <div class="nav-actions">
          <button id="btn-new-chat" class="btn btn-primary btn-sm" type="button">+ Новый чат</button>
          <a href="/static/profile.html" class="current-user-badge" title="Открыть профиль" style="text-decoration: none; cursor: pointer;">
            <img id="user-avatar-img" class="user-badge-avatar" src="" alt="avatar">
            <span id="current-username" class="user-badge-name">Загрузка...</span>
          </a>
          <button id="btn-logout" class="icon-btn" title="Выйти" type="button">🚪</button>
        </div>
      </header>

      <!-- Vue Advanced Chat Container -->
      <main class="chat-container-wrapper">
        <vue-advanced-chat
          id="chat-component"
          height="100%"
          theme="dark"
          load-first-room="true"
          rooms-loaded="true"
          loading-rooms="false"
          show-add-room="true"
          show-search="true"
          show-files="false"
          show-audio="false"
          show-emojis="true"
        ></vue-advanced-chat>
      </main>
    </div>

    <!-- New Chat / Group Modal -->
    <div id="new-chat-modal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Начать диалог или создать группу</h3>
          <p class="subtitle">Найдите пользователя или укажите название группы</p>
        </div>

        <div class="auth-tabs">
          <button id="tab-direct" class="tab-btn active" type="button">Личный чат</button>
          <button id="tab-group" class="tab-btn" type="button">Новая группа</button>
        </div>

        <!-- Direct Chat: Search Users -->
        <div id="direct-chat-tab-content">
          <div class="form-group">
            <label for="user-search-input">Поиск пользователей</label>
            <input type="text" id="user-search-input" placeholder="Введите имя пользователя..." autocomplete="off">
          </div>
          <div id="user-search-results" class="search-user-list">
            <div class="empty-search-text">Введите имя для поиска собеседника</div>
          </div>
        </div>

        <!-- Group Chat Form -->
        <form id="group-form" class="hidden">
          <div class="form-group">
            <label for="group-name">Название группы</label>
            <input type="text" id="group-name" placeholder="Например: Разработка" required>
          </div>
          <div class="form-group">
            <label for="group-members">ID участников (через запятую)</label>
            <input type="text" id="group-members" placeholder="например: 2, 3" required>
          </div>
          <div id="group-error" class="form-error hidden"></div>
          <button type="submit" class="btn btn-primary w-full">Создать группу</button>
        </form>

        <div class="modal-actions" style="margin-top: 16px;">
          <button type="button" id="btn-close-new-chat" class="btn btn-secondary w-full">Закрыть</button>
        </div>
      </div>
    </div>

  </div>

  <script src="/static/app.js?v=2"></script>
</body>
</html>
