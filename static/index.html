<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastAPI Messenger</title>

  <!-- Tailwind CSS & Inter Font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="/static/style.css?v=6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Проверка авторизации: если нет токена — мгновенно редиректим на /login до отрисовки страницы -->
  <script>
    if (!localStorage.getItem('access_token')) {
      window.location.replace('/login');
    }
  </script>
</head>
<body class="bg-[#1e1e1e] text-[#cccccc] h-screen w-screen overflow-hidden flex flex-col font-sans select-none">

  <!-- ==========================================
       1. ГЛАВНЫЙ ИНТЕРФЕЙС МЕССЕНДЖЕРА
       ========================================== -->
  <div id="messenger-app" class="h-full w-full flex overflow-hidden">

    <!-- Левый сайдбар (Список диалогов и профиль) -->
    <aside class="w-80 md:w-96 flex-shrink-0 flex flex-col bg-[#252526] border-r border-[#333333] z-10">
      
      <!-- Шапка сайдбара -->
      <div class="h-16 px-4 flex items-center justify-between border-b border-[#333333] flex-shrink-0">
        <div class="flex items-center gap-3">
          <!-- Аватарка профиля на левой стороне (ссылка на /profile) -->
          <a href="/profile" id="user-profile-link" class="relative group" title="Открыть настройки профиля">
            <img id="my-avatar" src="https://api.dicebear.com/7.x/identicon/svg?seed=user" alt="Профиль" class="w-9 h-9 rounded-full bg-[#2d2d2d] object-cover border-2 border-[#3c3c3c] group-hover:border-[#007acc] transition-all shadow" />
            <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 border-2 border-[#252526] rounded-full"></span>
          </a>

          <div>
            <div class="flex items-center gap-1.5">
              <span class="text-base font-bold text-[#e6e6e6] tracking-tight">Messenger</span>
            </div>
            <!-- Статус сокета -->
            <span id="ws-status" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-rose-500/15 text-rose-400 border border-rose-500/30">
              ● Офлайн
            </span>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- Кнопка создания чата -->
          <button id="btn-open-new-chat" type="button" class="p-2 rounded-lg text-[#cccccc] hover:text-white hover:bg-[#333333] border border-[#3c3c3c] transition-all" title="Создать чат или группу">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
          </button>

          <!-- Кнопка выхода -->
          <button id="btn-logout" type="button" class="p-2 rounded-lg text-[#969696] hover:text-rose-400 hover:bg-[#333333] border border-[#3c3c3c] transition-all" title="Выйти из аккаунта">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Поле поиска чатов -->
      <div class="p-3 border-b border-[#333333] flex-shrink-0">
        <div class="relative">
          <input 
            type="text" 
            id="chat-search-input" 
            placeholder="Поиск диалогов..." 
            class="w-full pl-9 pr-4 py-2 bg-[#1e1e1e] border border-[#3c3c3c] rounded-lg text-xs text-[#cccccc] placeholder-[#6e7681] focus:outline-none focus:border-[#007acc] focus:ring-1 focus:ring-[#007acc] transition-all"
          />
          <svg class="w-4 h-4 text-[#6e7681] absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>

      <!-- Контейнер списка чатов -->
      <div id="chat-list-container" class="flex-1 overflow-y-auto p-2 space-y-1">
        <!-- Список чатов рендерится через ui.js -->
      </div>
    </aside>

    <!-- Правая основная область чата -->
    <main class="flex-1 flex flex-col bg-[#1e1e1e] relative overflow-hidden">
      
      <!-- Заглушка, когда диалог не выбран -->
      <div id="empty-chat-view" class="flex-1 flex flex-col items-center justify-center p-8 text-center select-none">
        <h2 class="text-xl font-bold text-[#e6e6e6] mb-1">FastAPI Messenger</h2>
        <p class="text-sm text-[#969696] max-w-sm">
          Выберите диалог из списка слева или начните новый чат, нажав на кнопку «+».
        </p>
      </div>

      <!-- Активный чат (скрыт по умолчанию, показывается при выборе диалога) -->
      <div id="active-chat-view" class="flex-1 flex flex-col h-full overflow-hidden hidden">
        
        <!-- Шапка открытого чата -->
        <header id="active-chat-header" class="h-16 px-6 flex items-center justify-between bg-[#252526]/95 border-b border-[#333333] flex-shrink-0 z-10">
          <!-- Заполняется через ui.js -->
        </header>

        <!-- Лента сообщений -->
        <div id="messages-container" class="flex-1 overflow-y-auto px-4 md:px-8 py-6 space-y-2 select-text">
          <!-- Сообщения рендерятся через ui.js (ВСЕ слева!) -->
        </div>

        <!-- Поле отправки сообщения (Message Composer) -->
        <div class="px-4 md:px-8 py-3 bg-[#252526]/95 border-t border-[#333333] flex-shrink-0">
          <form id="message-form" class="flex items-center gap-2 w-full">
            <!-- Кнопка скидывания/прикрепления файлов -->
            <button 
              type="button" 
              id="btn-attach-file" 
              class="p-2.5 rounded-lg text-[#969696] hover:text-white hover:bg-[#333333] border border-[#3c3c3c] transition-all flex-shrink-0" 
              title="Прикрепить файл"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
              </svg>
            </button>
            <input type="file" id="file-input" class="hidden" />

            <input 
              type="text" 
              id="message-input" 
              placeholder="Напишите сообщение... (Enter для отправки)" 
              autocomplete="off"
              class="flex-1 px-4 py-2.5 bg-[#1e1e1e] border border-[#3c3c3c] rounded-lg text-sm text-[#cccccc] placeholder-[#6e7681] focus:outline-none focus:border-[#007acc] focus:ring-1 focus:ring-[#007acc] transition-all"
            />
            
            <button 
              type="submit" 
              id="btn-send-message" 
              class="p-2.5 bg-[#0e639c] hover:bg-[#1177bb] text-white rounded-lg flex items-center justify-center transition-all shadow-sm active:scale-95 flex-shrink-0"
              title="Отправить (Enter)"
            >
              <svg class="w-4 h-4 transform rotate-45" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
              </svg>
            </button>
          </form>
        </div>

      </div>

    </main>

  </div>

  <!-- ==========================================
       2. МОДАЛЬНОЕ ОКНО СОЗДАНИЯ ЧАТА / ГРУППЫ
       ========================================== -->
  <div id="new-chat-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden">
    <div class="w-full max-w-md bg-[#252526] border border-[#3c3c3c] rounded-xl p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-bold text-[#e6e6e6]">Создать диалог</h3>
        <button id="btn-close-new-chat" type="button" class="text-[#969696] hover:text-white p-1">✕</button>
      </div>

      <!-- Вкладки: Личный диалог / Группа -->
      <div class="flex bg-[#1e1e1e] p-1 rounded-lg border border-[#3c3c3c] mb-4">
        <button id="tab-direct-chat" type="button" class="flex-1 py-1.5 text-xs font-semibold rounded-md bg-[#0e639c] text-white transition-all">Личный чат</button>
        <button id="tab-group-chat" type="button" class="flex-1 py-1.5 text-xs font-semibold rounded-md text-[#969696] hover:text-white transition-all">Новая группа</button>
      </div>

      <!-- Поиск пользователей для прямого чата -->
      <div id="direct-chat-panel">
        <div class="relative mb-3">
          <input 
            type="text" 
            id="user-search-modal-input" 
            placeholder="Введите имя собеседника..." 
            class="w-full px-3.5 py-2 bg-[#1e1e1e] border border-[#3c3c3c] rounded-lg text-xs text-[#cccccc] placeholder-[#6e7681] focus:outline-none focus:border-[#007acc] transition-all"
          />
        </div>
        <div id="user-search-results" class="max-h-56 overflow-y-auto space-y-1.5">
          <div class="text-center text-xs text-[#6e7681] py-6">Начните вводить имя пользователя</div>
        </div>
      </div>

      <!-- Форма создания группы -->
      <form id="group-chat-form" class="space-y-3 hidden">
        <div>
          <label class="block text-xs font-semibold text-[#cccccc] mb-1">Название группы</label>
          <input type="text" id="group-name-input" required placeholder="Например: Разработка" class="w-full px-3.5 py-2 bg-[#1e1e1e] border border-[#3c3c3c] rounded-lg text-xs text-[#cccccc] placeholder-[#6e7681] focus:outline-none focus:border-[#007acc] transition-all" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#cccccc] mb-1">ID участников (через запятую)</label>
          <input type="text" id="group-members-input" required placeholder="например: 2, 3" class="w-full px-3.5 py-2 bg-[#1e1e1e] border border-[#3c3c3c] rounded-lg text-xs text-[#cccccc] placeholder-[#6e7681] focus:outline-none focus:border-[#007acc] transition-all" />
        </div>
        <div id="group-error" class="text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 p-2.5 rounded-lg hidden"></div>
        <button type="submit" class="w-full py-2.5 bg-[#0e639c] hover:bg-[#1177bb] text-white font-semibold text-xs rounded-lg transition-all shadow-sm">Создать группу</button>
      </form>
    </div>
  </div>

  <!-- Главный модуль клиентской логики (ES Module) -->
  <script type="module" src="/static/app.js?v=8"></script>
</body>
</html>
