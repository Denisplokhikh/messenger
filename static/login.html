<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | FastAPI Messenger</title>

  <!-- Tailwind CSS & Inter Font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="/static/style.css?v=7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Быстрая проверка: если токен уже есть — мгновенно редиректим в мессенджер -->
  <script>
    if (localStorage.getItem('access_token')) {
      window.location.replace('/');
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen w-screen flex items-center justify-center font-sans p-4 select-none">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-7 shadow-2xl relative overflow-hidden">
    <!-- Фоновое свечение -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="text-center mb-6 relative z-10">
      <div class="text-4xl mb-2">💬</div>
      <h1 class="text-2xl font-bold text-slate-100 tracking-tight">FastAPI Messenger</h1>
      <p class="text-xs text-slate-400 mt-1">Вход в систему обмена сообщениями</p>
    </div>

    <!-- Вкладки: Вход / Регистрация -->
    <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 mb-5 relative z-10">
      <button id="tab-login" type="button" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white transition-all shadow-sm">Вход</button>
      <button id="tab-register" type="button" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition-all">Регистрация</button>
    </div>

    <!-- Форма логина -->
    <form id="login-form" class="space-y-4 relative z-10">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Имя пользователя или Email</label>
        <input type="text" id="login-username" required autocomplete="username" placeholder="alex или alex@mail.com" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Пароль</label>
        <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" />
      </div>
      <div id="login-error" class="text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 p-2.5 rounded-lg hidden"></div>
      <button type="submit" id="btn-login-submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white font-semibold text-sm rounded-xl transition-all shadow-md">Войти</button>
    </form>

    <!-- Форма регистрации -->
    <form id="register-form" class="space-y-4 hidden relative z-10">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Имя пользователя (Логин)</label>
        <input type="text" id="reg-username" required autocomplete="username" placeholder="alex" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Электронная почта</label>
        <input type="email" id="reg-email" required autocomplete="email" placeholder="alex@mail.com" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Пароль (минимум 6 символов)</label>
        <input type="password" id="reg-password" minlength="6" required autocomplete="new-password" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" />
      </div>
      <div id="register-error" class="text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 p-2.5 rounded-lg hidden"></div>
      <button type="submit" id="btn-register-submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white font-semibold text-sm rounded-xl transition-all shadow-md">Зарегистрироваться</button>
    </form>
  </div>

  <script type="module">
    import { api } from '/static/js/api.js';

    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");
    const loginError = document.getElementById("login-error");
    const registerError = document.getElementById("register-error");

    tabLogin.addEventListener("click", () => {
      tabLogin.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white transition-all shadow-sm";
      tabRegister.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition-all";
      loginForm.classList.remove("hidden");
      registerForm.classList.add("hidden");
    });

    tabRegister.addEventListener("click", () => {
      tabRegister.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white transition-all shadow-sm";
      tabLogin.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition-all";
      registerForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.classList.add("hidden");

      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value;

      try {
        const data = await api.login(username, password);
        localStorage.setItem("access_token", data.access_token);
        window.location.replace('/');
      } catch (err) {
        loginError.textContent = err.message || "Неверный логин или пароль";
        loginError.classList.remove("hidden");
      }
    });

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      registerError.classList.add("hidden");

      const username = document.getElementById("reg-username").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value;

      try {
        await api.register(username, email, password);
        const data = await api.login(username, password);
        localStorage.setItem("access_token", data.access_token);
        window.location.replace('/');
      } catch (err) {
        registerError.textContent = err.message || "Ошибка регистрации";
        registerError.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
